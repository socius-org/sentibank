# Builds the Jupyter Book in docs/ (executing its notebooks) and publishes it to the
# gh-pages branch, which GitHub Pages serves at https://doc.socius.org/sentibank/.
# Runs whenever docs/ or the package changes on main, or manually from the Actions tab.

name: sentibank Docs

on:
  push:
    branches: ['main']
    paths:
      - 'docs/**'
      - 'sentibank/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Use Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            docs/requirements.txt
            pyproject.toml

      - name: Install system libraries for pyenchant
        run: sudo apt-get update && sudo apt-get install -y libenchant-2-2

      - name: Install sentibank and the docs toolchain
        run: |
          pip install .
          pip install -r docs/requirements.txt
          python -m spacy download en_core_web_sm

      - name: Build the book
        run: jupyter-book build docs

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/_build/html
          publish_branch: gh-pages
          force_orphan: true
          commit_message: 'Deploy docs from ${{ github.sha }}'
